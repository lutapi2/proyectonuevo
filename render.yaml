services:
  - type: web
    name: betana
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q .
    startCommand: python app.py
    disk:
      name: betana-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BETANA_DATA_DIR
        value: /var/data
      - key: BETANA_ADMIN_PASSWORD
        sync: false
      - key: BETANA_COOKIE_SECURE
        value: "true"
