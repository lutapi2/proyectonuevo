<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BETANA | Calzado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/script.js" defer></script>
</head>
<body class="min-h-screen flex flex-col pt-14">

    <header class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur-sm z-40 px-4 py-4 flex justify-between items-center transition-all duration-300 border-b border-transparent hover:border-gray-100">
        <div class="w-1/3">
            <button class="text-micro uppercase hover:text-gray-500 transition-colors">Menú</button>
        </div>
        <div class="w-1/3 text-center">
            <h1 class="text-lg font-light tracking-[0.25em] uppercase cursor-pointer">BETANA</h1>
        </div>
        <div class="w-1/3 flex justify-end gap-4">
            <button id="btn-open-admin-modal" type="button" class="text-micro uppercase hover:text-gray-500 transition-colors">
                Administrar
            </button>
            <button id="btn-logout" type="button" class="hidden text-micro uppercase hover:text-gray-500 transition-colors">
                Salir
            </button>
            <button id="btn-open-modal" type="button" class="hidden text-micro uppercase hover:text-gray-500 transition-colors">
                + Añadir
            </button>
        </div>
    </header>

    <div id="admin-modal" class="fixed inset-0 bg-white z-50 flex flex-col hidden opacity-0 transition-opacity duration-300 overflow-y-auto no-scrollbar">
        <div class="px-4 py-4 flex justify-between items-center sticky top-0 bg-white z-10">
            <span class="text-micro uppercase">Acceso de administración</span>
            <button id="btn-close-admin-modal" type="button" class="text-micro uppercase hover:text-gray-500 transition-colors">
                Cerrar ✕
            </button>
        </div>
        <div class="flex-grow flex items-center justify-center p-6 sm:p-12">
            <form id="admin-form" class="w-full max-w-lg space-y-8">
                <div>
                    <label for="admin-password" class="block text-micro uppercase text-gray-500 mb-2">Clave de administrador</label>
                    <input type="password" id="admin-password" class="editorial-input text-micro" required autocomplete="current-password">
                </div>
                <p id="admin-message" class="hidden text-micro text-red-600" role="alert"></p>
                <button id="btn-admin-login" type="submit" class="w-full bg-black text-white text-micro uppercase py-4 hover:bg-gray-800 transition-colors">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <div id="add-modal" class="fixed inset-0 bg-white z-50 flex flex-col hidden opacity-0 transition-opacity duration-300 overflow-y-auto no-scrollbar">
        <div class="px-4 py-4 flex justify-between items-center sticky top-0 bg-white z-10">
            <span class="text-micro uppercase">Nuevo artículo</span>
            <button id="btn-close-modal" type="button" class="text-micro uppercase hover:text-gray-500 transition-colors">
                Cerrar ✕
            </button>
        </div>

        <div class="flex-grow flex items-center justify-center p-6 sm:p-12">
            <form id="add-form" class="w-full max-w-lg space-y-10">
                <div>
                    <label for="shoe-name" class="block text-micro uppercase text-gray-500 mb-2">Nombre del artículo</label>
                    <input type="text" id="shoe-name" name="name" class="editorial-input text-micro uppercase" placeholder="Ej. ZAPATO TACÓN PIEL" maxlength="100" required autocomplete="off">
                </div>
                <div>
                    <label for="shoe-price" class="block text-micro uppercase text-gray-500 mb-2">Precio en COP</label>
                    <input type="number" id="shoe-price" name="price" class="editorial-input text-micro uppercase" placeholder="Ej. 359000" min="1" max="1000000000" step="1" required autocomplete="off">
                </div>
                <div>
                    <label for="shoe-img-file" class="block text-micro uppercase text-gray-500 mb-4">Imagen (máximo 5 MB)</label>
                    <input type="file" id="shoe-img-file" name="image" class="w-full text-micro font-light" accept="image/png,image/jpeg,image/gif,image/webp" required>
                </div>
                <p id="form-message" class="hidden text-micro text-red-600" role="alert"></p>
                <div class="pt-4">
                    <button id="btn-save-product" type="submit" class="w-full bg-black text-white text-micro uppercase py-4 hover:bg-gray-800 transition-colors">
                        Guardar artículo
                    </button>
                </div>
            </form>
        </div>
    </div>

    <main class="flex-grow w-full px-1">
        <section>
            <p id="app-message" class="hidden text-center py-8 text-micro text-red-600" role="alert"></p>
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-1">
                <!-- Artículos renderizados por JavaScript -->
            </div>

            <div id="empty-state" class="hidden text-center py-32">
                <p class="text-micro text-gray-400 uppercase">Colección vacía</p>
            </div>
        </section>
    </main>

    <footer class="w-full py-16 text-center mt-12 border-t border-gray-100">
        <p class="text-micro text-gray-400 uppercase">
            &copy; <span id="year"></span> BETANA. Estudio Minimalista.
        </p>
    </footer>

</body>
</html>
